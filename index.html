<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Favicons ──────────────────────────────────────────────────── -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />

    <!-- ── PWA ───────────────────────────────────────────────────────── -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FoundaXia" />

    <!-- ── Primary Meta ──────────────────────────────────────────────── -->
    <title>FoundaXia - One-on-One Focus on Your Children's Development</title>
    <meta name="description" content="FoundaXia offers elite one-on-one online tutoring for K-12 students, covering Math, Science, English, coding, and exam preparation like JAMB, WAEC, SAT." />
    <meta name="theme-color" content="#0F2C59" />

    <!-- ── Open Graph (Google, Facebook, WhatsApp previews) ─────────── -->
    <link rel="canonical" href="https://foundaxia.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://foundaxia.com/" />
    <meta property="og:title" content="FoundaXia - One-on-One Focus on Your Children's Development" />
    <meta property="og:description" content="Elite one-on-one online tutoring for K-12 students. Math, Science, English, coding and exam prep (JAMB, WAEC, SAT)." />
    <meta property="og:image" content="https://foundaxia.com/images/logo_combined.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="FoundaXia" />

    <!-- ── Twitter Card ───────────────────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FoundaXia - One-on-One Focus on Your Children's Development" />
    <meta name="twitter:description" content="Elite one-on-one online tutoring for K-12 students. Math, Science, English, coding and exam prep." />
    <meta name="twitter:image" content="https://foundaxia.com/images/logo_combined.jpg" />

    <!-- ── Fonts (loaded async so a slow/blocked font CDN never delays first render) ── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600;700;800&display=swap" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
